<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="stadium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="50%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#stadium)" />
  <!-- Field lines -->
  <circle cx="400" cy="300" r="140" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
  <line x1="400" y1="0" x2="400" y2="600" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
  <circle cx="400" cy="300" r="10" fill="#ffffff" />
  
  <!-- Score Card Glass -->
  <rect x="100" y="100" width="600" height="400" rx="32" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <text x="400" y="160" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#4ade80" text-anchor="middle" letter-spacing="2">GIẢI BÓNG ĐÁ TRUYỀN THỐNG ĐOÀN TRƯỜNG</text>
  <text x="400" y="200" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">TRẬN BÁN KẾT KỊCH TÍNH</text>

  <g transform="translate(180, 240)">
    <text x="60" y="40" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">11A3</text>
    <text x="60" y="120" font-family="-apple-system, sans-serif" font-size="70" font-weight="900" fill="#38e6c5" text-anchor="middle">3</text>
  </g>

  <text x="400" y="340" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="rgba(255,255,255,0.4)" text-anchor="middle">-</text>

  <g transform="translate(500, 240)">
    <text x="60" y="40" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">11A1</text>
    <text x="60" y="120" font-family="-apple-system, sans-serif" font-size="70" font-weight="900" fill="#ffb84d" text-anchor="middle">2</text>
  </g>

  <rect x="250" y="420" width="300" height="44" rx="22" fill="rgba(255,255,255,0.12)" />
  <text x="400" y="448" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">🔥 Phút 90+2: Sút phạt hình quả chuối!</text>
</svg>